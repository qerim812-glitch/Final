<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in or create an account for Social Circle — Tirana's social hotspot booking app." />
    <title>Social Circle — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body auth-body">
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <header class="auth-header">
          <div class="auth-brand">
            <span class="brand-dot" aria-hidden="true"></span>
            <span>Social Circle</span>
          </div>
          <h1 id="auth-title" class="auth-title">Tonight starts here.</h1>
          <p class="auth-sub">Sign in or create an account to see who's out in Tirana.</p>
        </header>

        <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
          <button
            type="button"
            class="auth-tab active"
            role="tab"
            aria-selected="true"
            data-auth-tab="signin"
          >
            Sign in
          </button>
          <button
            type="button"
            class="auth-tab"
            role="tab"
            aria-selected="false"
            data-auth-tab="signup"
          >
            Sign up
          </button>
        </div>

        <!-- SIGN IN -->
        <form id="auth-signin-form" class="auth-panel" novalidate>
          <div class="form-group">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <div id="signin-error" class="error-message" role="alert" aria-live="polite"></div>
          <button type="submit" class="btn-primary btn-full-width">Sign in</button>
          <p class="auth-hint">Admin? Use <code>admin</code> / <code>Admin2016</code>.</p>
        </form>

        <!-- SIGN UP -->
        <form id="auth-signup-form" class="auth-panel hidden" novalidate>
          <div class="form-group">
            <label for="initial-email">Email</label>
            <input type="email" id="initial-email" required autocomplete="email" placeholder="you@example.com" />
            <div id="registration-email-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label for="initial-password">Password</label>
            <input type="password" id="initial-password" required autocomplete="new-password" placeholder="••••••••" />
            <div class="strength-meter" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Password strength">
              <div id="password-strength-bar" class="strength-bar"></div>
            </div>
            <small class="form-hint">Min 6 chars — add numbers and symbols for strength.</small>
            <div id="registration-password-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" required autocomplete="new-password" placeholder="••••••••" />
            <div id="confirm-password-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label for="initial-age-range">Age range</label>
            <select id="initial-age-range" required>
              <option value="" disabled selected>Select your age range</option>
              <option value="18-24">18–24</option>
              <option value="25-30">25–30</option>
              <option value="31-36">31–36</option>
              <option value="37+">37+</option>
            </select>
          </div>
          <button type="submit" class="btn-primary btn-full-width">Create account</button>
        </form>

        <p class="auth-footer">© 2026 Social Circle</p>
      </section>
    </main>

    <!-- Kept so the existing registration handler in app.js stays wired up -->
    <form id="initial-registration-form" class="hidden"></form>

    <script src="app.js"></script>
  </body>
</html>
